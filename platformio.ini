[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    sinricpro/SinricPro

; El SDK de Edge Impulse (Arduino library exportada desde el Studio) no se
; distribuye por lib_deps: exportar el modelo entrenado como "Arduino library"
; y descomprimirlo dentro de lib/ (crea lib/<nombre_proyecto>_inferencing/...).
; Luego activar EI_CLASSIFIER_ENABLED en src/core/config.h.

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Silencia el log interno (muy verboso) de la libreria WebSockets que usa
    ; SinricPro. El log propio de SinricPro (conexion/comandos) se deja
    ; activo por ahora para verificar el primer emparejamiento.
    -DNODEBUG_WEBSOCKETS
